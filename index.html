<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGN TON Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/tonweb@0.0.60/dist/tonweb.js"></script>
  <script src="https://unpkg.com/tonweb-mnemonic@1.0.1/dist/web/tonweb-mnemonic.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0b0e14; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #app { width: 100%; max-width: 420px; }
    .card { background: #161b22; border: 1px solid #21262d; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    .title { font-size: 22px; font-weight: 700; color: #38bdf8; margin-bottom: 20px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn { background: #0284c7; color: white; border: none; padding: 14px; border-radius: 12px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn-danger { background: #dc2626; }
    .btn-success { background: #16a34a; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 14px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); padding: 20px; z-index: 100; align-items: center; justify-content: center; }
    .modal-content { background: #161b22; border: 1px solid #30363d; padding: 20px; width: 100%; max-width: 380px; border-radius: 16px; text-align: center; }
    .phrase-box { background: #0d1117; padding: 12px; border-radius: 8px; border: 1px dashed #38bdf8; margin: 12px 0; word-break: break-all; font-family: monospace; color: #38bdf8; font-size: 13px; }
    .flex-gap { display: flex; gap: 10px; }
  </style>
</head>
<body>

<div id="app">
  <div class="title">💎 TGN TON Wallet</div>
  <div id="mainContent" class="card">Initializing TON Library...</div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-top:0;">Settings</h3>
    <div id="modalBody"></div>
    <button class="btn btn-secondary" onclick="closeModal()" style="margin-top:12px;">Close</button>
  </div>
</div>

<script>
  const API_KEY = "c09170dd62724a03f3803b0f1023219c672c0fcc02a2deed31bd75faea36e9e1";
  let tonweb, walletData = JSON.parse(localStorage.getItem("TGN_TON_WALLET"));

  function getMnemonicLib() {
    return window.tonwebMnemonic || (window.TonWeb && window.TonWeb.mnemonic);
  }

  function showToast(msg) {
    if (window.Telegram?.WebApp) window.Telegram.WebApp.showAlert(msg);
    else alert(msg);
  }

  function renderWelcome() {
    document.getElementById("mainContent").innerHTML = `
      <p style="color:#8b949e; margin-bottom:20px;">No wallet found on this device.</p>
      <button class="btn" onclick="createWallet()">✨ Create New Wallet</button>
      <button class="btn btn-secondary" onclick="showImport()">📥 Import Seed Phrase</button>
    `;
  }

  async function createWallet() {
    try {
      const mLib = getMnemonicLib();
      if (!mLib) throw new Error("Mnemonic library loading failed. Please refresh and try again.");
      
      const seed = await mLib.generateMnemonic();
      const keyPair = await mLib.mnemonicToKeyPair(seed);
      const WalletClass = tonweb.wallet.all.v4R2;
      const wallet = new WalletClass(tonweb.provider, { publicKey: keyPair.publicKey });
      const address = (await wallet.getAddress()).toString(true, true, true);

      walletData = {
        mnemonic: seed.join(" "),
        publicKey: TonWeb.utils.bytesToHex(keyPair.publicKey),
        secretKey: TonWeb.utils.bytesToHex(keyPair.secretKey),
        address: address
      };

      localStorage.setItem("TGN_TON_WALLET", JSON.stringify(walletData));
      renderMain();
      refreshBalance();
    } catch (e) {
      alert("Error creating wallet: " + e.message);
    }
  }

  function showImport() {
    document.getElementById("modalTitle").innerText = "Import Seed Phrase";
    document.getElementById("modalBody").innerHTML = `
      <p style="font-size:13px; color:#8b949e;">Enter 24 secret words separated by spaces:</p>
      <textarea id="importSeed" rows="4" placeholder="word1 word2 ..."></textarea>
      <button class="btn" onclick="importWallet()">Import Wallet</button>
    `;
    document.getElementById("modal").style.display = "flex";
  }

  async function importWallet() {
    const text = document.getElementById("importSeed").value.trim();
    if (!text) return alert("Please enter your seed phrase");
    const words = text.split(/\s+/);

    try {
      const mLib = getMnemonicLib();
      if (!mLib) throw new Error("Mnemonic library not loaded yet.");

      const keyPair = await mLib.mnemonicToKeyPair(words);
      const WalletClass = tonweb.wallet.all.v4R2;
      const wallet = new WalletClass(tonweb.provider, { publicKey: keyPair.publicKey });
      const address = (await wallet.getAddress()).toString(true, true, true);

      walletData = {
        mnemonic: words.join(" "),
        publicKey: TonWeb.utils.bytesToHex(keyPair.publicKey),
        secretKey: TonWeb.utils.bytesToHex(keyPair.secretKey),
        address: address
      };

      localStorage.setItem("TGN_TON_WALLET", JSON.stringify(walletData));
      closeModal();
      renderMain();
      refreshBalance();
    } catch (e) {
      alert("Invalid seed phrase: " + e.message);
    }
  }

  function renderMain() {
    document.getElementById("mainContent").innerHTML = `
      <div style="font-size:12px; color:#8b949e;">Wallet Address</div>
      <div style="font-size:13px; font-weight:bold; word-break:break-all; margin:8px 0; color:#38bdf8;">${walletData.address}</div>
      <button class="btn btn-secondary" onclick="copyAddress()" style="padding:8px; font-size:13px;">📋 Copy Address</button>
      
      <hr style="border:0; border-top:1px solid #21262d; margin:20px 0;">

      <div style="font-size:12px; color:#8b949e;">Balance</div>
      <h1 id="balance" style="font-size:32px; margin:10px 0; color:#ffffff;">0.00 TON</h1>
      <button class="btn btn-secondary" onclick="refreshBalance()" style="padding:8px; font-size:13px;">🔄 Refresh Balance</button>

      <div class="flex-gap" style="margin-top:20px;">
        <button class="btn" onclick="openSend()">📤 Send</button>
        <button class="btn btn-success" onclick="openReceive()">📥 Receive</button>
      </div>
      
      <button class="btn btn-secondary" onclick="openSettings()" style="margin-top:15px;">⚙️ Settings / Backup</button>
    `;
  }

  async function refreshBalance() {
    if (!walletData) return;
    document.getElementById("balance").innerText = "Loading...";
    try {
      const balance = await tonweb.getBalance(walletData.address);
      document.getElementById("balance").innerText = (balance / 1e9).toFixed(2) + " TON";
    } catch (e) {
      document.getElementById("balance").innerText = "0.00 TON";
    }
  }

  function copyAddress() {
    navigator.clipboard.writeText(walletData.address);
    showToast("Address copied!");
  }

  function openReceive() {
    document.getElementById("modalTitle").innerText = "Receive TON";
    document.getElementById("modalBody").innerHTML = `
      <p style="font-size:12px; color:#8b949e;">Send TON to this address:</p>
      <div class="phrase-box">${walletData.address}</div>
      <button class="btn" onclick="copyAddress()">Copy Address</button>
    `;
    document.getElementById("modal").style.display = "flex";
  }

  function openSend() {
    document.getElementById("modalTitle").innerText = "Send TON";
    document.getElementById("modalBody").innerHTML = `
      <input id="sendTo" placeholder="Recipient TON Address">
      <input id="sendAmount" type="number" step="0.01" placeholder="Amount TON">
      <button class="btn" onclick="doSend()">Send Now</button>
    `;
    document.getElementById("modal").style.display = "flex";
  }

  async function doSend() {
    const to = document.getElementById("sendTo").value.trim();
    const amount = document.getElementById("sendAmount").value.trim();
    if (!to || !amount) return alert("Please fill address and amount");

    try {
      const keyPair = {
        publicKey: TonWeb.utils.hexToBytes(walletData.publicKey),
        secretKey: TonWeb.utils.hexToBytes(walletData.secretKey)
      };
      const WalletClass = tonweb.wallet.all.v4R2;
      const wallet = new WalletClass(tonweb.provider, { publicKey: keyPair.publicKey });
      const seqno = await wallet.methods.seqno().call() || 0;

      await wallet.methods.transfer({
        secretKey: keyPair.secretKey,
        toAddress: to,
        amount: TonWeb.utils.toNano(amount),
        seqno: seqno,
        payload: "Sent from TGN Wallet",
        sendMode: 3
      }).send();

      closeModal();
      showToast("Transaction sent!");
      setTimeout(refreshBalance, 3000);
    } catch (e) {
      alert("Send failed: " + e.message);
    }
  }

  function openSettings() {
    document.getElementById("modalTitle").innerText = "Settings";
    document.getElementById("modalBody").innerHTML = `
      <button class="btn btn-secondary" onclick="showPhrase()">🔑 Show Recovery Phrase</button>
      <div id="phraseBox" class="phrase-box" style="display:none;"></div>
      <button class="btn btn-danger" onclick="resetWallet()" style="margin-top:10px;">⚠️ Reset / Delete Wallet</button>
    `;
    document.getElementById("modal").style.display = "flex";
  }

  function showPhrase() {
    document.getElementById("phraseBox").style.display = "block";
    document.getElementById("phraseBox").innerText = walletData.mnemonic;
  }

  function resetWallet() {
    if (confirm("Are you sure? Make sure you saved the recovery phrase!")) {
      localStorage.removeItem("TGN_TON_WALLET");
      location.reload();
    }
  }

  function closeModal() {
    document.getElementById("modal").style.display = "none";
  }

  window.onload = function() {
    if (typeof TonWeb === "undefined") {
      document.getElementById("mainContent").innerHTML = "Failed to load TON Web Library. Check internet connection.";
      return;
    }
    tonweb = new TonWeb(new TonWeb.HttpProvider("https://testnet.toncenter.com/api/v2/jsonRPC", { apiKey: API_KEY }));
    if (walletData) {
      renderMain();
      refreshBalance();
    } else {
      renderWelcome();
    }
  };
</script>
</body>
</html>
