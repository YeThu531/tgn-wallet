<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGN TON Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/tonweb@0.0.60/dist/tonweb.js"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 15px; text-align: center; }
    .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    button { background: #0088cc; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 8px; cursor: pointer; }
    button:active { opacity: 0.8; }
    input { width: 90%; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); padding-top: 50px; }
    .modal-content { background: #1e293b; margin: auto; padding: 20px; width: 85%; border-radius: 12px; }
    .phrase-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px dashed #0088cc; margin: 10px 0; word-break: break-all; }
  </style>
</head>
<body>

<div id="app">
  <h2>💎 TGN TON Wallet</h2>
  <div class="card">Loading TON Web Library... Please refresh in a moment.</div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Settings</h3>
    <div id="modalBody"></div>
    <button onclick="closeModal()" style="background:#475569; margin-top:10px;">Close</button>
  </div>
</div>

<script>
  const API_KEY = ""; 
  let tonweb, walletData = JSON.parse(localStorage.getItem("TGN_TON_WALLET"));

  function showToast(msg) {
    if (window.Telegram?.WebApp) window.Telegram.WebApp.showAlert(msg);
    else alert(msg);
  }

  function renderWelcome() {
    document.getElementById("app").innerHTML = `
      <h2>💎 TGN TON Wallet</h2>
      <div class="card">
        <p>No wallet found on this device.</p>
        <button onclick="createWallet()">✨ Create New Wallet</button>
        <button onclick="showImport()" style="background:#334155; margin-top:10px;">📥 Import Seed Phrase</button>
      </div>
    `;
  }

  async function createWallet() {
    try {
      const seed = TonWeb.mnemonic.generateMnemonic();
      const keyPair = await TonWeb.mnemonic.mnemonicToKeyPair(seed);
      const WalletClass = tonweb.wallet.all.v4R2;
      const wallet = new WalletClass(tonweb.provider, { publicKey: keyPair.publicKey });
      const address = (await wallet.getAddress()).toString(true, true, true);

      walletData = {
        mnemonic: seed.join(" "),
        publicKey: TonWeb.utils.bytesToHex(keyPair.publicKey),
        secretKey: TonWeb.utils.bytesToHex(keyPair.secretKey),
        address: address
      };

      localStorage.setItem("TGN_TON_WALLET", JSON.stringify(walletData));
      renderMain();
      refreshBalance();
    } catch (e) {
      alert("Error creating wallet: " + e.message);
    }
  }

  function showImport() {
    document.getElementById("modalTitle").innerText = "Import Seed Phrase";
    document.getElementById("modalBody").innerHTML = `
      <p>Enter 24 secret words separated by spaces:</p>
      <input id="importSeed" placeholder="word1 word2 ...">
      <button onclick="importWallet()">Import</button>
    `;
    document.getElementById("modal").style.display = "block";
  }

  async function importWallet() {
    const text = document.getElementById("importSeed").value.trim();
    if (!text) return alert("Please enter your seed phrase");
    const words = text.split(/\s+/);

    try {
      const keyPair = await TonWeb.mnemonic.mnemonicToKeyPair(words);
      const WalletClass = tonweb.wallet.all.v4R2;
      const wallet = new WalletClass(tonweb.provider, { publicKey: keyPair.publicKey });
      const address = (await wallet.getAddress()).toString(true, true, true);

      walletData = {
        mnemonic: words.join(" "),
        publicKey: TonWeb.utils.bytesToHex(keyPair.publicKey),
        secretKey: TonWeb.utils.bytesToHex(keyPair.secretKey),
        address: address
      };

      localStorage.setItem("TGN_TON_WALLET", JSON.stringify(walletData));
      closeModal();
      renderMain();
      refreshBalance();
    } catch (e) {
      alert("Invalid seed phrase: " + e.message);
    }
  }

  function renderMain() {
    document.getElementById("app").innerHTML = `
      <h2>💎 TGN TON Wallet</h2>
      <div class="card">
        <p style="font-size:12px; color:#94a3b8;">Wallet Address</p>
        <p style="font-size:13px; font-weight:bold; word-break:break-all;">${walletData.address}</p>
        <button onclick="copyAddress()" style="background:#334155;">📋 Copy Address</button>
      </div>

      <div class="card">
        <p style="font-size:12px; color:#94a3b8;">Balance</p>
        <h1 id="balance">0.00 TON</h1>
        <button onclick="refreshBalance()" style="background:#0284c7;">🔄 Refresh Balance</button>
      </div>

      <div style="display:flex; gap:10px;">
        <button onclick="openSend()">📤 Send</button>
        <button onclick="openReceive()" style="background:#059669;">📥 Receive</button>
      </div>
      
      <button onclick="openSettings()" style="background:#475569; margin-top:15px;">⚙️ Settings / Backup</button>
    `;
  }

  async function refreshBalance() {
    if (!walletData) return;
    document.getElementById("balance").innerText = "Loading...";
    try {
      const balance = await tonweb.getBalance(walletData.address);
      document.getElementById("balance").innerText = (balance / 1e9).toFixed(2) + " TON";
    } catch (e) {
      document.getElementById("balance").innerText = "0.00 TON";
    }
  }

  function copyAddress() {
    navigator.clipboard.writeText(walletData.address);
    showToast("Address copied!");
  }

  function openReceive() {
    document.getElementById("modalTitle").innerText = "Receive TON";
    document.getElementById("modalBody").innerHTML = `
      <p style="font-size:12px;">Send TON to this address:</p>
      <div class="phrase-box">${walletData.address}</div>
      <button onclick="copyAddress()">Copy Address</button>
    `;
    document.getElementById("modal").style.display = "block";
  }

  function openSend() {
    document.getElementById("modalTitle").innerText = "Send TON";
    document.getElementById("modalBody").innerHTML = `
      <input id="sendTo" placeholder="Recipient TON Address">
      <input id="sendAmount" type="number" step="0.01" placeholder="Amount TON">
      <button onclick="doSend()">Send Now</button>
    `;
    document.getElementById("modal").style.display = "block";
  }

  async function doSend() {
    const to = document.getElementById("sendTo").value.trim();
    const amount = document.getElementById("sendAmount").value.trim();
    if (!to || !amount) return alert("Please fill address and amount");

    try {
      const keyPair = {
        publicKey: TonWeb.utils.hexToBytes(walletData.publicKey),
        secretKey: TonWeb.utils.hexToBytes(walletData.secretKey)
      };
      const WalletClass = tonweb.wallet.all.v4R2;
      const wallet = new WalletClass(tonweb.provider, { publicKey: keyPair.publicKey });
      const seqno = await wallet.methods.seqno().call() || 0;

      await wallet.methods.transfer({
        secretKey: keyPair.secretKey,
        toAddress: to,
        amount: TonWeb.utils.toNano(amount),
        seqno: seqno,
        payload: "Sent from TGN Wallet",
        sendMode: 3
      }).send();

      closeModal();
      showToast("Transaction sent!");
      setTimeout(refreshBalance, 3000);
    } catch (e) {
      alert("Send failed: " + e.message);
    }
  }

  function openSettings() {
    document.getElementById("modalTitle").innerText = "Settings";
    document.getElementById("modalBody").innerHTML = `
      <button onclick="showPhrase()" style="background:#0e7490;">🔑 Show Recovery Phrase</button>
      <div id="phraseBox" class="phrase-box" style="display:none;"></div>
      <button onclick="resetWallet()" style="background:#b91c1c; margin-top:10px;">⚠️ Delete / Reset Wallet</button>
    `;
    document.getElementById("modal").style.display = "block";
  }

  function showPhrase() {
    document.getElementById("phraseBox").style.display = "block";
    document.getElementById("phraseBox").innerText = walletData.mnemonic;
  }

  function resetWallet() {
    if (confirm("Are you sure? Make sure you saved the recovery phrase!")) {
      localStorage.removeItem("TGN_TON_WALLET");
      location.reload();
    }
  }

  function closeModal() {
    document.getElementById("modal").style.display = "none";
  }

  window.onload = function() {
    if (typeof TonWeb === "undefined") {
      document.getElementById("app").innerHTML = "<div class='card'>Loading TON Web Library failed. Please check internet or refresh.</div>";
      return;
    }
    tonweb = new TonWeb(new TonWeb.HttpProvider("https://testnet.toncenter.com/api/v2/jsonRPC", { apiKey: API_KEY }));
    if (walletData) {
      renderMain();
      refreshBalance();
    } else {
      renderWelcome();
    }
  };
</script>
</body>
</html>
