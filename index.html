<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>TGN TON Wallet</title>

  <!-- Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- TONWeb -->
  <script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.60/dist/tonweb.js"></script>

  <!-- Existing CSS -->
  <link rel="stylesheet" href="style.css">


  <!-- =====================================================
       PREMIUM BOTTOM NAVIGATION CSS
       ===================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      -webkit-tap-highlight-color: transparent;
    }


    body {
      overflow-x: hidden;
    }


    /* =====================================================
       MAIN CONTAINER
       ===================================================== */

    .container {
      width: 100%;
      min-height: 100vh;
      position: relative;

      padding-bottom: 115px;
    }


    /* =====================================================
       BOTTOM NAVIGATION
       ===================================================== */

    .bottom-nav {

      position: fixed;

      left: 12px;
      right: 12px;

      bottom: 12px;

      height: 82px;

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      align-items: end;

      padding: 8px 8px 7px;

      background:
        rgba(13, 25, 45, 0.96);

      border:
        1px solid rgba(91, 139, 202, 0.16);

      border-radius: 22px;

      box-shadow:
        0 -10px 30px rgba(0, 0, 0, 0.20),
        0 12px 35px rgba(0, 0, 0, 0.30);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      z-index: 99999;
    }


    /* =====================================================
       NAV BUTTON
       ===================================================== */

    .bottom-nav-item {

      position: relative;

      width: 100%;
      height: 68px;

      min-width: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 5px;

      padding: 0;
      margin: 0;

      border: 0;
      outline: none;

      background: transparent;

      color: #8fa4c3;

      font-family: inherit;

      font-size: 13px;

      font-weight: 500;

      line-height: 16px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        color .2s ease,
        transform .2s ease;
    }


    .bottom-nav-item span {

      display: block;

      white-space: nowrap;
    }


    /* =====================================================
       NAV ICON
       ===================================================== */

    .nav-icon {

      width: 25px;
      height: 25px;

      flex: 0 0 auto;

      transition:
        transform .2s ease,
        filter .2s ease;
    }


    /* =====================================================
       ACTIVE BUTTON
       ===================================================== */

    .bottom-nav-item.active {

      color: #2693ff;
    }


    .bottom-nav-item.active .nav-icon {

      transform:
        translateY(-1px);

      filter:
        drop-shadow(
          0 0 7px
          rgba(38, 147, 255, .45)
        );
    }


    /* Small blue active indicator */

    .bottom-nav-item.active::before {

      content: "";

      position: absolute;

      top: 3px;

      width: 30px;
      height: 3px;

      border-radius: 10px;

      background: #2693ff;

      box-shadow:
        0 0 12px
        rgba(38, 147, 255, .7);
    }


    /* =====================================================
       CENTER SEND BUTTON
       ===================================================== */

    .send-nav {

      justify-content: flex-end;

      padding-bottom: 4px;
    }


    .send-circle {

      position: absolute;

      top: -29px;

      width: 64px;
      height: 64px;

      display: flex;

      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #279cff 0%,
          #1476f5 55%,
          #075bd1 100%
        );

      border:
        4px solid #07152b;

      box-shadow:

        0 8px 24px
        rgba(20, 118, 245, .42),

        0 0 0 1px
        rgba(72, 166, 255, .25);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }


    /* =====================================================
       SEND ICON
       ===================================================== */

    .send-circle svg {

      width: 29px;
      height: 29px;

      color: #ffffff;

      transform:
        rotate(-3deg);
    }


    /* =====================================================
       SEND TEXT
       ===================================================== */

    .send-nav span {

      margin-top: 3px;

      color: #9fb3d1;

      font-weight: 500;
    }


    /* =====================================================
       SEND ACTIVE
       ===================================================== */

    .send-nav.active {

      color: #2693ff;
    }


    .send-nav.active .send-circle {

      transform:
        translateY(-2px);

      box-shadow:

        0 10px 28px
        rgba(20, 118, 245, .55),

        0 0 25px
        rgba(38, 147, 255, .20);
    }


    /* =====================================================
       BUTTON PRESS EFFECT
       ===================================================== */

    .bottom-nav-item:active {

      transform:
        scale(.94);
    }


    .send-nav:active .send-circle {

      transform:
        scale(.92);
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 420px) {

      .bottom-nav {

        left: 9px;
        right: 9px;

        bottom: 9px;

        height: 78px;

        padding-left: 4px;
        padding-right: 4px;

        border-radius: 20px;
      }


      .bottom-nav-item {

        height: 65px;

        font-size: 12px;
      }


      .nav-icon {

        width: 23px;
        height: 23px;
      }


      .send-circle {

        width: 60px;
        height: 60px;

        top: -27px;
      }


      .send-circle svg {

        width: 27px;
        height: 27px;
      }
    }


    /* =====================================================
       TELEGRAM / ANDROID SAFE AREA
       ===================================================== */

    @supports (
      padding-bottom: env(safe-area-inset-bottom)
    ) {

      .bottom-nav {

        bottom:
          calc(
            9px +
            env(safe-area-inset-bottom)
          );
      }

    }


    /* =====================================================
       PREVENT NAV FROM COVERING CONTENT
       ===================================================== */

    #content {

      padding-bottom: 20px;
    }

  </style>

</head>


<body>


  <!-- =====================================================
       MAIN APP
       ===================================================== -->

  <div class="container">

    <!-- App Content -->
    <div id="content">
      Loading...
    </div>


    <!-- ===================================================
         BOTTOM NAVIGATION
         =================================================== -->

    <div class="bottom-nav">


      <!-- ================= HOME ================= -->

      <button
        class="bottom-nav-item active"
        id="nav-home"
        type="button"
        onclick="switchNav('home')"
      >

        <svg
          class="nav-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path
            d="M3 10.5L12 3l9 7.5"
          ></path>

          <path
            d="M5 9.5V21h14V9.5"
          ></path>

          <path
            d="M9 21v-7h6v7"
          ></path>

        </svg>

        <span>
          Home
        </span>

      </button>


      <!-- ================= ACTIVITY ================= -->

      <button
        class="bottom-nav-item"
        id="nav-activity"
        type="button"
        onclick="switchNav('activity')"
      >

        <svg
          class="nav-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >

          <line
            x1="8"
            y1="6"
            x2="21"
            y2="6"
          ></line>

          <line
            x1="8"
            y1="12"
            x2="21"
            y2="12"
          ></line>

          <line
            x1="8"
            y1="18"
            x2="21"
            y2="18"
          ></line>

          <circle
            cx="3.5"
            cy="6"
            r="1"
          ></circle>

          <circle
            cx="3.5"
            cy="12"
            r="1"
          ></circle>

          <circle
            cx="3.5"
            cy="18"
            r="1"
          ></circle>

        </svg>

        <span>
          Activity
        </span>

      </button>


      <!-- ================= SEND ================= -->

      <button
        class="bottom-nav-item send-nav"
        id="nav-send"
        type="button"
        onclick="switchNav('send')"
      >

        <div class="send-circle">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <path
              d="M22 2L11 13"
            ></path>

            <path
              d="M22 2l-7 20-4-9-9-4z"
            ></path>

          </svg>

        </div>

        <span>
          Send
        </span>

      </button>


      <!-- ================= WALLET ================= -->

      <button
        class="bottom-nav-item"
        id="nav-wallet"
        type="button"
        onclick="switchNav('wallet')"
      >

        <svg
          class="nav-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path
            d="M20 7H5a3 3 0 0 1 0-6h13v4"
          ></path>

          <path
            d="M5 1v6"
          ></path>

          <path
            d="M20 7v14H5a3 3 0 0 1-3-3V4"
          ></path>

          <path
            d="M16 13h5v4h-5a2 2 0 1 1 0-4z"
          ></path>

        </svg>

        <span>
          Wallet
        </span>

      </button>


      <!-- ================= PROFILE ================= -->

      <button
        class="bottom-nav-item"
        id="nav-profile"
        type="button"
        onclick="switchNav('profile')"
      >

        <svg
          class="nav-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >

          <circle
            cx="12"
            cy="7"
            r="4"
          ></circle>

          <path
            d="M4 21v-1a7 7 0 0 1 14 0v1"
          ></path>

        </svg>

        <span>
          Profile
        </span>

      </button>


    </div>

  </div>


  <!-- =====================================================
       MODAL
       ===================================================== -->

  <div
    id="modal"
    class="modal"
  >

    <div class="modal-content">

      <h3
        id="mTitle"
        style="
          margin-top:0;
          color:#38bdf8;
        "
      >
        Settings
      </h3>


      <div id="mBody"></div>


      <button
        class="btn btn-secondary"
        type="button"
        onclick="closeModal()"
        style="
          margin-top:16px;
          width:100%;
        "
      >
        Close
      </button>

    </div>

  </div>


  <!-- =====================================================
       APP JAVASCRIPT
       ===================================================== -->

  <script src="app.js"></script>


</body>

</html>
