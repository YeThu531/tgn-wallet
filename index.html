<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGN TON Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.60/dist/tonweb.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0e14; color: #ffffff; margin: 0; padding: 16px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #app { width: 100%; max-width: 400px; }
    .card { background: #161b22; border: 1px solid #21262d; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .title { font-size: 20px; font-weight: 700; color: #38bdf8; margin-bottom: 20px; }
    .btn { background: #0284c7; color: white; border: none; padding: 14px; border-radius: 12px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn-danger { background: #dc2626; }
    .btn-success { background: #16a34a; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); padding: 20px; z-index: 100; align-items: center; justify-content: center; }
    .modal-content { background: #161b22; border: 1px solid #30363d; padding: 20px; width: 100%; max-width: 360px; border-radius: 16px; text-align: center; }
    .box { background: #0d1117; padding: 10px; border-radius: 8px; border: 1px dashed #38bdf8; word-break: break-all; font-family: monospace; color: #38bdf8; font-size: 12px; margin: 10px 0; }
    .flex { display: flex; gap: 8px; }
  </style>
</head>
<body>

<div id="app">
  <div class="card">
    <div class="title">💎 TGN TON Wallet</div>
    <div id="content">Loading Wallet...</div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="mTitle" style="margin-top:0;">Settings</h3>
    <div id="mBody"></div>
    <button class="btn btn-secondary" onclick="closeModal()" style="margin-top:12px;">Close</button>
  </div>
</div>

<script>
  const API_KEY = "c09170dd62724a03f3803b0f1023219c672c0fcc02a2deed31bd75faea36e9e1";
  let tonweb, walletData = JSON.parse(localStorage.getItem("TGN_TON_WALLET"));

  // BIP39 standard simple English wordlist subset for native generation
  const WORDLIST = [
    "abandon","ability","able","about","above","absent","absorb","abstract","absurd","abuse","access","accident",
    "account","accuse","achieve","acid","acoustic","acquire","across","act","action","actor","actress","actual",
    "adapt","add","addict","address","adjust","admit","adult","advance","advice","aerobic","affair","afford",
    "afraid","again","age","agent","agree","ahead","aim","air","airport","aisle","alarm","album","alcohol",
    "alert","alien","all","alley","allow","almost","alone","alpha","already","also","alter","always","amateur",
    "amazing","among","amount","amused","analyst","anchor","ancient","anger","angle","angry","animal","ankle",
    "announce","annual","answer","antenna","antique","anxiety","any","apart","apology","appear","apple","approve",
    "april","arch","arctic","area","arena","argue","arm","armed","armor","army","around","arrange","arrest",
    "arrive","arrow","art","artefact","artist","artwork","ask","aspect","assault","asset","assist","assume",
    "asthma","athlete","atom","attack","attend","attitude","attract","auction","audit","august","aunt","author",
    "auto","autumn","average","avocado","avoid","awake","aware","away","awesome","awful","awkward","axis"
  ];

  function generateNativeMnemonic() {
    let words = [];
    const randomValues = new Uint8Array(24);
    window.crypto.getRandomValues(randomValues);
    for (let i = 0; i < 24; i++) {
      let index = randomValues[i] % WORDLIST.length;
      words.push(WORDLIST[index]);
    }
    return words;
  }

  function showToast(msg) {
    if (window.Telegram?.WebApp) window.Telegram.WebApp.showAlert(msg);
    else alert(msg);
  }

  function renderWelcome() {
    document.getElementById("content").innerHTML = `
      <p style="color:#8b949e; margin-bottom:20px;">No wallet found on this device.</p>
      <button class="btn" onclick="createWallet()">✨ Create New Wallet</button>
      <button class="btn btn-secondary" onclick="showImport()">📥 Import Seed Phrase</button>
    `;
  }

  async function createWallet() {
    try {
      const seed = generateNativeMnemonic();
      // Derive key from seed text using TonWeb utility
      const seedBytes = new TextEncoder().encode(seed.join(" "));
      const hash = await window.crypto.subtle.digest("SHA-256", seedBytes);
      const secretKey = new Uint8Array(hash);
      
      // Generate keypair via tweetnacl inside TonWeb if available, or fallback
      const keyPair = TonWeb.utils.nacl.sign.keyPair.fromSeed(secretKey);

      const WalletClass = tonweb.wallet.all.v4R2;
      const wallet = new WalletClass(tonweb.provider, { publicKey: keyPair.publicKey });
      const address = (await wallet.getAddress()).toString(true, true, true);

      walletData = {
        mnemonic: seed.join(" "),
        publicKey: TonWeb.utils.bytesToHex(keyPair.publicKey),
        secretKey: TonWeb.utils.bytesToHex(keyPair.secretKey),
        address: address
      };

      localStorage.setItem("TGN_TON_WALLET", JSON.stringify(walletData));
      renderMain();
      refreshBalance();
    } catch (e) {
      alert("Error: " + e.message);
    }
  }

  function showImport() {
    document.getElementById("mTitle").innerText = "Import Wallet";
    document.getElementById("mBody").innerHTML = `
      <textarea id="importSeed" rows="4" placeholder="Enter seed words..."></textarea>
      <button class="btn" onclick="importWallet()">Import</button>
    `;
    document.getElementById("modal").style.display = "flex";
  }

  async function importWallet() {
    const text = document.getElementById("importSeed").value.trim();
    if (!text) return alert("Please enter seed phrase");
    
    try {
      const seedBytes = new TextEncoder().encode(text);
      const hash = await window.crypto.subtle.digest("SHA-256", seedBytes);
      const secretKey = new Uint8Array(hash);
      const keyPair = TonWeb.utils.nacl.sign.keyPair.fromSeed(secretKey);

      const WalletClass = tonweb.wallet.all.v4R2;
      const wallet = new WalletClass(tonweb.provider, { publicKey: keyPair.publicKey });
      const address = (await wallet.getAddress()).toString(true, true, true);

      walletData = {
        mnemonic: text,
        publicKey: TonWeb.utils.bytesToHex(keyPair.publicKey),
        secretKey: TonWeb.utils.bytesToHex(keyPair.secretKey),
        address: address
      };

      localStorage.setItem("TGN_TON_WALLET", JSON.stringify(walletData));
      closeModal();
      renderMain();
      refreshBalance();
    } catch (e) {
      alert("Invalid seed: " + e.message);
    }
  }

  function renderMain() {
    document.getElementById("content").innerHTML = `
      <div style="font-size:12px; color:#8b949e;">Wallet Address</div>
      <div class="box">${walletData.address}</div>
      <button class="btn btn-secondary" onclick="copyAddress()" style="padding:8px; font-size:12px;">📋 Copy Address</button>
      
      <hr style="border:0; border-top:1px solid #21262d; margin:16px 0;">

      <div style="font-size:12px; color:#8b949e;">Balance</div>
      <h2 id="balance" style="font-size:28px; margin:8px 0;">0.00 TON</h2>
      <button class="btn btn-secondary" onclick="refreshBalance()" style="padding:6px; font-size:12px;">🔄 Refresh</button>

      <div class="flex" style="margin-top:16px;">
        <button class="btn" onclick="openSend()">📤 Send</button>
        <button class="btn btn-success" onclick="openReceive()">📥 Receive</button>
      </div>
      
      <button class="btn btn-secondary" onclick="openSettings()" style="margin-top:12px;">⚙️ Settings</button>
    `;
  }

  async function refreshBalance() {
    if (!walletData) return;
    document.getElementById("balance").innerText = "Loading...";
    try {
      const balance = await tonweb.getBalance(walletData.address);
      document.getElementById("balance").innerText = (balance / 1e9).toFixed(2) + " TON";
    } catch (e) {
      document.getElementById("balance").innerText = "0.00 TON";
    }
  }

  function copyAddress() {
    navigator.clipboard.writeText(walletData.address);
    showToast("Address copied!");
  }

  function openReceive() {
    document.getElementById("mTitle").innerText = "Receive TON";
    document.getElementById("mBody").innerHTML = `
      <div class="box">${walletData.address}</div>
      <button class="btn" onclick="copyAddress()">Copy Address</button>
    `;
    document.getElementById("modal").style.display = "flex";
  }

  function openSend() {
    document.getElementById("mTitle").innerText = "Send TON";
    document.getElementById("mBody").innerHTML = `
      <input id="sendTo" placeholder="Recipient Address">
      <input id="sendAmount" type="number" step="0.01" placeholder="Amount TON">
      <button class="btn" onclick="doSend()">Send Now</button>
    `;
    document.getElementById("modal").style.display = "flex";
  }

  async function doSend() {
    const to = document.getElementById("sendTo").value.trim();
    const amount = document.getElementById("sendAmount").value.trim();
    if (!to || !amount) return alert("Fill all fields");

    try {
      const keyPair = {
        publicKey: TonWeb.utils.hexToBytes(walletData.publicKey),
        secretKey: TonWeb.utils.hexToBytes(walletData.secretKey)
      };
      const WalletClass = tonweb.wallet.all.v4R2;
      const wallet = new WalletClass(tonweb.provider, { publicKey: keyPair.publicKey });
      const seqno = await wallet.methods.seqno().call() || 0;

      await wallet.methods.transfer({
        secretKey: keyPair.secretKey,
        toAddress: to,
        amount: TonWeb.utils.toNano(amount),
        seqno: seqno,
        payload: "Sent from TGN Wallet",
        sendMode: 3
      }).send();

      closeModal();
      showToast("Transaction Sent!");
      setTimeout(refreshBalance, 3000);
    } catch (e) {
      alert("Failed: " + e.message);
    }
  }

  function openSettings() {
    document.getElementById("mTitle").innerText = "Settings";
    document.getElementById("mBody").innerHTML = `
      <button class="btn btn-secondary" onclick="showPhrase()">🔑 Show Recovery Phrase</button>
      <div id="phraseBox" class="box" style="display:none;"></div>
      <button class="btn btn-danger" onclick="resetWallet()" style="margin-top:10px;">⚠️ Reset Wallet</button>
    `;
    document.getElementById("modal").style.display = "flex";
  }

  function showPhrase() {
    document.getElementById("phraseBox").style.display = "block";
    document.getElementById("phraseBox").innerText = walletData.mnemonic;
  }

  function resetWallet() {
    if (confirm("Reset wallet? Backup your seed first!")) {
      localStorage.removeItem("TGN_TON_WALLET");
      location.reload();
    }
  }

  function closeModal() {
    document.getElementById("modal").style.display = "none";
  }

  window.onload = function() {
    if (typeof TonWeb === "undefined") {
      document.getElementById("content").innerHTML = "Error loading TonWeb library.";
      return;
    }
    tonweb = new TonWeb(new TonWeb.HttpProvider("https://testnet.toncenter.com/api/v2/jsonRPC", { apiKey: API_KEY }));
    if (walletData) {
      renderMain();
      refreshBalance();
    } else {
      renderWelcome();
    }
  };
</script>
</body>
</html>
