<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TGN Wallet Bot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <div id="toast" class="toast-msg">Copied!</div>

    <header class="app-header">
      <div class="header-title">
        <i class="fa-solid fa-xmark"></i> 
        <span>TGNWallet-bot</span>
      </div>
      <div class="header-icons">
        <i class="fa-solid fa-chevron-down"></i>
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>
    </header>

    <main id="main-content" class="main-content">
      </main>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('home', this)">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </button>
      <button class="nav-item" onclick="switchTab('activity', this)">
        <i class="fa-solid fa-chart-line"></i>
        <span>Activity</span>
      </button>
      <button class="nav-item send-nav-btn" onclick="switchTab('send', this)">
        <div class="send-circle">
          <i class="fa-solid fa-paper-plane"></i>
        </div>
        <span>Send</span>
      </button>
      <button class="nav-item" onclick="switchTab('wallet', this)">
        <i class="fa-solid fa-wallet"></i>
        <span>Wallet</span>
      </button>
      <button class="nav-item" onclick="switchTab('airdrop', this)">
        <i class="fa-solid fa-parachute-box"></i>
        <span>Airdrop</span>
        <span class="badge-new">NEW</span>
      </button>
      <button class="nav-item" onclick="switchTab('profile', this)">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </button>
    </nav>

    <div id="deposit-modal" class="step-modal">
      <div class="modal-header-top">
        <div class="modal-title-text">Deposit TON</div>
        <i class="fa-solid fa-xmark modal-close-btn" onclick="closeModal('deposit-modal')"></i>
      </div>
      <div style="margin-top: 10px;">
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">ထည့်သွင်းလိုသော TON ပမာဏကို ရိုက်ထည့်ပါ -</p>
        <input type="number" id="deposit-input" placeholder="e.g. 5.0" style="width: 100%; padding: 12px; background: rgba(15,23,42,0.8); border: 1px solid rgba(59,130,246,0.3); border-radius: 12px; color: #fff; font-size: 16px; outline: none; margin-bottom: 16px;">
        <button class="btn-main" style="width: 100%; padding: 12px;" onclick="confirmDeposit()">Confirm Deposit</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
