<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGN TON Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.60/dist/tonweb.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div id="content">Loading...</div>

  <div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </div>
    <div class="nav-item" onclick="switchTab('activity')">
      <span class="nav-icon">📜</span>
      <span>Activity</span>
    </div>
    <div class="nav-item center-send" onclick="openSend()">
      <span class="nav-icon">✈️</span>
    </div>
    <div class="nav-item" onclick="switchTab('wallet')">
      <span class="nav-icon">👛</span>
      <span>Wallet</span>
    </div>
    <div class="nav-item" onclick="switchTab('profile')">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="mTitle" style="margin-top:0; color:#38bdf8;">Settings</h3>
    <div id="mBody"></div>
    <button class="btn btn-secondary" onclick="closeModal()" style="margin-top:16px;">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
