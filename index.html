<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TGN Wallet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <main id="main-content" class="main-content">
      </main>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('home', this)">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </button>
      <button class="nav-item" onclick="switchTab('activity', this)">
        <i class="fa-solid fa-chart-line"></i>
        <span>Activity</span>
      </button>
      <button class="nav-item send-nav-btn" onclick="switchTab('send', this)">
        <div class="send-circle">
          <i class="fa-solid fa-paper-plane"></i>
        </div>
        <span>Send</span>
      </button>
      <button class="nav-item" onclick="switchTab('wallet', this)">
        <i class="fa-solid fa-wallet"></i>
        <span>Wallet</span>
      </button>
      <button class="nav-item" onclick="switchTab('airdrop', this)">
        <i class="fa-solid fa-parachute-box"></i>
        <span>Airdrop</span>
      </button>
      <button class="nav-item" onclick="switchTab('profile', this)">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script type="module" src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
