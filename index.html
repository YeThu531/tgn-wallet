<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TGN Wallet</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="app" class="tgn-app-container">
        
        <div id="loading-screen" class="loading-screen">
            <div class="spinner"></div>
            <p>Loading TGN Wallet...</p>
        </div>

        <div id="main-content" style="display: none;">
            
            <header class="app-header">
                <div class="user-info">
                    <span id="user-name">TGN User</span>
                    <span id="user-id" class="sub-text"></span>
                </div>
            </header>

            <section class="wallet-section">
                <div class="balance-card">
                    <h3>TON Balance</h3>
                    <h1 id="ton-balance">0.00 TON</h1>
                    <button id="connect-wallet-btn" class="btn-primary">Connect Wallet</button>
                </div>
            </section>

            <section class="tasks-section">
                <h2>Airdrop Tasks</h2>
                <div id="tasks-list" class="tasks-list">
                    </div>
            </section>

        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
