<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>TGN TON Wallet</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.60/dist/tonweb.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <main id="content">
    Loading...
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

    <button
      class="bottom-nav-item active"
      id="nav-home"
      type="button"
      onclick="switchNav('home')"
    >
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </button>

    <button
      class="bottom-nav-item"
      id="nav-activity"
      type="button"
      onclick="switchNav('activity')"
    >
      <span class="nav-icon">☷</span>
      <span>Activity</span>
    </button>

    <button
      class="bottom-nav-item send-nav"
      id="nav-send"
      type="button"
      onclick="switchNav('send')"
    >
      <span class="send-circle">➤</span>
      <span>Send</span>
    </button>

    <button
      class="bottom-nav-item"
      id="nav-wallet"
      type="button"
      onclick="switchNav('wallet')"
    >
      <span class="nav-icon">▣</span>
      <span>Wallet</span>
    </button>

    <button
      class="bottom-nav-item"
      id="nav-profile"
      type="button"
      onclick="switchNav('profile')"
    >
      <span class="nav-icon">♙</span>
      <span>Profile</span>
    </button>

  </nav>

</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Modal -->
<div
  id="modal"
  class="modal"
  onclick="if(event.target===this) closeModal()"
>

  <div class="modal-content">

    <div
      class="modal-title"
      id="mTitle"
    >
      TGN Wallet
    </div>

    <div id="mBody"></div>

    <button
      class="btn secondary"
      type="button"
      onclick="closeModal()"
    >
      Close
    </button>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
