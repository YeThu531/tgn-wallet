<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGN TON Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.60/dist/tonweb.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="wallet-card">
    <div class="logo">💎</div>
    <div class="title">TGN TON Wallet</div>
    <div class="subtitle">Modular Web3 Wallet</div>
    <div id="content">Loading...</div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="mTitle" style="margin-top:0; color:var(--accent);">Settings</h3>
    <div id="mBody"></div>
    <button class="btn btn-secondary" onclick="closeModal()" style="margin-top:16px;">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
